name: Integrated PDF verification
on:
  push:
    branches: [feature/fenton-pdf-table-079]
  pull_request:
    branches: [main]
    paths:
      - 'fenton-*.js'
      - 'vendor/pdfjs/**'
      - 'tests/fenton-*.test.js'
      - 'scripts/ci-pdf-vendor.mjs'
      - 'scripts/verify-fenton-pdf.cjs'
      - '.github/workflows/fenton-pdf-verification.yml'
permissions:
  contents: read
jobs:
  verify-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned verification tools
        run: npm install --prefix "$RUNNER_TEMP/grow-pdf-qa" --no-audit --no-fund playwright@1.58.2 pdfjs-dist@5.6.205
      - name: Verify self-hosted PDF reader
        env:
          GROW_QA_MODULES: ${{ runner.temp }}/grow-pdf-qa/node_modules
        run: node scripts/ci-pdf-vendor.mjs
      - name: Install Chromium
        run: node "$RUNNER_TEMP/grow-pdf-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Complete application test suite
        run: |
          mkdir -p qa-output
          npm test 2>&1 | tee qa-output/tests.txt
      - name: Browser, PDF and offline verification
        env:
          GROW_QA_MODULES: ${{ runner.temp }}/grow-pdf-qa/node_modules
        run: node scripts/verify-fenton-pdf.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GROW_NEO_0.7.9_Verificacoes
          path: qa-output/
